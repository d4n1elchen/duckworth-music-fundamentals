<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
    } catch {}
  </script>
  <title>互動音樂實驗室 | Duckworth 創意音樂基礎 11e</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home">
  <header id="site-header"></header>

  <div class="app-shell">
    <aside id="course-sidebar" class="course-sidebar"></aside>

    <main class="lesson-main">
      <section class="chapter-hero">
        <span class="chapter-eyebrow">🎹 Interactive Music Lab · Duckworth 11e</span>
        <h1 id="main-heading" tabindex="-1">用耳朵與手指玩懂樂理</h1>
        <p class="chapter-subtitle">
          拋開死背課文！全書 15 章＋7 大檢定站＋附錄全部濃縮成<strong>可彈、可畫、可聽、可闖關</strong>的視覺聲音玩具。
        </p>
        <div class="pill-row">
          <span class="visual-pill">🎛️ <strong>即時聲波合成</strong></span>
          <span class="visual-pill">🎼 <strong>十二音色彩樂譜</strong></span>
          <span class="visual-pill">🥁 <strong>MPC 節奏鼓機</strong></span>
          <span class="visual-pill">🎯 <strong>極速識譜闖關</strong></span>
        </div>
        <div class="widget-controls" style="margin-block-start:0.85rem;">
          <a class="btn btn-primary" href="intro.html">🚀 開始闖關：導論</a>
          <a class="btn" href="ch01-basics.html">第 1 章：節奏與譜號</a>
          <a class="btn" href="glossary.html">📖 術語快查</a>
        </div>
      </section>

      <!-- 即刻創作體驗：8x8 旋律方塊 + 滑奏鋼琴 -->
      <section class="lesson-section" aria-labelledby="instant-play-heading">
        <h2 id="instant-play-heading">✨ 10 秒上手：點格子寫歌 ＆ 滑奏彩虹鍵盤</h2>
        <div class="tabs">
          <div class="tablist" focusgroup="tablist nomemory" aria-label="首頁互動體驗切換">
            <button type="button" id="tab-song" aria-selected="true" focusgroupstart>🎨 8×8 旋律創作方格</button>
            <button type="button" id="tab-kb" aria-selected="false">🎹 滑奏合成鍵盤</button>
          </div>
          <div role="tabpanel" aria-labelledby="tab-song">
            <div class="tabpanel-inner">
              <div id="home-song-grid"></div>
            </div>
          </div>
          <div role="tabpanel" aria-labelledby="tab-kb" hidden="until-found">
            <div class="tabpanel-inner">
              <div class="widget-controls" style="margin-block-start:0;">
                <button type="button" class="btn btn-sm btn-primary" id="demo-scale-btn">▶ C 大調音階</button>
                <button type="button" class="btn btn-sm btn-amber" id="demo-cadence-btn">▶ I – IV – V7 – I 終止式</button>
              </div>
              <div id="home-demo-piano"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 闖關進度儀表板 -->
      <section class="lesson-section" aria-labelledby="dash-heading">
        <h2 id="dash-heading">🏆 闖關進度儀表板</h2>
        <div class="concept-grid" id="dashboard-stats"></div>
      </section>

      <!-- 全書 19 個互動單元地圖 -->
      <section class="lesson-section" aria-labelledby="syllabus-heading">
        <h2 id="syllabus-heading">🗺️ 全書章節闖關地圖（19 個互動單元 · 全站 20 頁）</h2>
        <div id="syllabus-grid-mount"></div>
      </section>
    </main>
  </div>

  <footer id="site-footer"></footer>

  <script defer src="js/course-data.js"></script>
  <script defer src="js/audio-engine.js"></script>
  <script defer src="js/notation.js"></script>
  <script defer src="js/widgets.js"></script>
  <script defer src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Widgets.createSongGrid('#home-song-grid');

      const piano = Widgets.createPiano('#home-demo-piano', {
        startMidi: 48,
        endMidi: 76,
        showLandmarks: true
      });

      document.getElementById('demo-scale-btn')?.addEventListener('click', () => {
        const scale = CourseData.buildScale('C4', 'major').notes;
        piano.highlightMidi(scale.map(n => n.midi), 60);
        AudioEngine.playSequence(scale.map(n => ({ pitch: n, beats: 0.42 })), 104, {
          onStep: (ev) => piano.flashKey(ev.pitch.midi, 220)
        });
      });

      document.getElementById('demo-cadence-btn')?.addEventListener('click', () => {
        const chords = [
          ['C3', 'C4', 'E4', 'G4'],
          ['F3', 'C4', 'F4', 'A4'],
          ['G3', 'B3', 'F4', 'G4'],
          ['C3', 'C4', 'E4', 'G4']
        ];
        AudioEngine.playSequence(chords.map(c => ({ notes: c, beats: 1.2 })), 92, {
          onStep: (ev) => {
            const midis = ev.notes.map(s => CourseData.parsePitch(s).midi);
            piano.highlightMidi(midis, 60);
            midis.forEach(m => piano.flashKey(m, 500));
          }
        });
      });

      function renderDashboard() {
        const prog = CourseData.getProgress();
        const pages = CourseData.COURSE_PAGES.filter(p => p.id !== 'home');
        const doneCount = pages.filter(p => prog.completedPages[p.id]).length;
        const pct = Math.round((doneCount / pages.length) * 100);
        const quizEntries = Object.values(prog.quizScores || {});
        const totalQ = quizEntries.reduce((s, q) => s + q.total, 0);
        const totalC = quizEntries.reduce((s, q) => s + q.correct, 0);
        const qPct = totalQ > 0 ? Math.round((totalC / totalQ) * 100) : 0;

        document.getElementById('dashboard-stats').innerHTML = `
          <div class="concept-card" style="display:flex;align-items:center;gap:0.85rem;">
            <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true" style="flex-shrink:0;">
              <circle cx="28" cy="28" r="22" fill="none" stroke="var(--bg-subtle)" stroke-width="6"/>
              <circle cx="28" cy="28" r="22" fill="none" stroke="var(--brand)" stroke-width="6"
                stroke-dasharray="138.2" stroke-dashoffset="${138.2 * (1 - pct / 100)}" stroke-linecap="round" transform="rotate(-90 28 28)"/>
              <text x="28" y="32" text-anchor="middle" font-size="12" font-weight="800" fill="var(--text-primary)">${pct}%</text>
            </svg>
            <div>
              <h3 style="margin:0;">已通關單元</h3>
              <p style="font-family:var(--font-mono);font-size:1.25rem;font-weight:800;color:var(--brand);margin:0.1rem 0;">${doneCount} / ${pages.length}</p>
            </div>
          </div>
          <div class="concept-card" style="display:flex;align-items:center;gap:0.85rem;">
            <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true" style="flex-shrink:0;">
              <circle cx="28" cy="28" r="22" fill="none" stroke="var(--bg-subtle)" stroke-width="6"/>
              <circle cx="28" cy="28" r="22" fill="none" stroke="var(--accent-amber)" stroke-width="6"
                stroke-dasharray="138.2" stroke-dashoffset="${138.2 * (1 - qPct / 100)}" stroke-linecap="round" transform="rotate(-90 28 28)"/>
              <text x="28" y="32" text-anchor="middle" font-size="12" font-weight="800" fill="var(--text-primary)">${qPct}%</text>
            </svg>
            <div>
              <h3 style="margin:0;">檢定答對率</h3>
              <p style="font-family:var(--font-mono);font-size:1.25rem;font-weight:800;color:var(--accent-amber);margin:0.1rem 0;">${quizEntries.length} 組已測</p>
            </div>
          </div>
          <div class="concept-card">
            <h3 style="margin:0;">🎯 終極任務</h3>
            <p style="font-weight:700;color:var(--success);margin-block:0.25rem 0;">Ch 15 獨立為旋律配和聲與寫歌！</p>
          </div>
        `;

        const groups = new Map();
        pages.forEach(p => {
          if (!groups.has(p.group)) groups.set(p.group, []);
          groups.get(p.group).push(p);
        });

        let html = '';
        let gIdx = 0;
        for (const [gName, items] of groups.entries()) {
          html += `<h3 style="margin-block:1.1rem 0.45rem;font-size:0.95rem;color:var(--text-muted);">${gName}</h3><div class="concept-grid">`;
          for (const item of items) {
            const isDone = !!prog.completedPages[item.id];
            const accent = AudioEngine.PITCH_COLORS[gIdx % 12];
            gIdx++;
            html += `
              <a href="${item.file}" class="concept-card" style="text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;border-inline-start:4px solid ${isDone ? 'var(--success)' : accent};">
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-block-end:0.3rem;">
                    <span class="badge">${item.num}</span>
                    ${isDone ? '<span style="color:var(--success);font-weight:800;font-size:0.8rem;">✓ 完成</span>' : '<span style="color:var(--brand);font-weight:700;font-size:0.8rem;">PLAY →</span>'}
                  </div>
                  <h4 style="margin:0.15rem 0;font-size:0.98rem;">${item.title}</h4>
                </div>
                <span style="font-size:0.76rem;color:var(--text-muted);margin-block-start:0.35rem;" lang="en">${item.en}</span>
              </a>
            `;
          }
          html += `</div>`;
        }
        document.getElementById('syllabus-grid-mount').innerHTML = html;
      }

      renderDashboard();
      window.addEventListener('course-progress-updated', renderDashboard);
    });
  </script>
</body>
</html>
