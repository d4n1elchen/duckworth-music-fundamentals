<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
    } catch {}
  </script>
  <title>第 8 章：音程李薩如共振儀與轉位 ＋ 焦點技能 5 | 創意音樂基礎 11e</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="ch08">
  <header id="site-header"></header>

  <div class="app-shell">
    <aside id="course-sidebar" class="course-sidebar"></aside>

    <main class="lesson-main">
      <section class="chapter-hero">
        <span class="chapter-eyebrow">Chapter 8 + Focus on Skills 5</span>
        <h1 id="main-heading" tabindex="-1">第 8 章：音程共振軌跡、複音程與和聲轉位 (Sum = 9)</h1>
        <p class="chapter-subtitle">
          先數字母定<strong>度數 (Size)</strong>，再用大調音階定<strong>性質 (P, M, m, A, d)</strong>。打開共振儀直接「看見」協和與不協和！
        </p>
        <div class="pill-row">
          <span class="visual-pill">💎 完全家族 <strong>1·4·5·8</strong>：<code>d ← P → A</code></span>
          <span class="visual-pill">🌈 大小家族 <strong>2·3·6·7</strong>：<code>d ← m ← M → A</code></span>
          <span class="visual-pill">🔄 轉位公式：<strong>度數和 = 9</strong> · <code>P↔P, M↔m, A↔d</code></span>
        </div>
      </section>

      <!-- 1. 李薩如音程協和共振軌跡儀 -->
      <section class="lesson-section" aria-labelledby="ch8-lis">
        <h2 id="ch8-lis">🌀 1. 李薩如音程共振儀（看見整數頻率比的幾何協和美）</h2>
        <div class="widget-box">
          <div id="ch08-lissajous"></div>
        </div>
      </section>

      <!-- 2. 音程建構、複音程與一鍵八度轉位器 -->
      <section class="lesson-section" aria-labelledby="ch8-lab">
        <h2 id="ch8-lab">🔬 2. 互動音程建構器 ＆ 一鍵八度轉位機</h2>
        <div class="widget-box">
          <div class="widget-controls" style="margin-block-start:0;">
            <label style="font-weight:700;font-size:0.86rem;">根音：
              <select id="int-root">
                <option value="C4">C4</option>
                <option value="D4">D4</option>
                <option value="Eb4">E♭4</option>
                <option value="F4">F4</option>
                <option value="F#4">F♯4</option>
                <option value="G4">G4</option>
                <option value="A3">A3</option>
              </select>
            </label>
            <label style="font-weight:700;font-size:0.86rem;">性質：
              <select id="int-qual">
                <option value="P">完全 P</option>
                <option value="M" selected>大 M</option>
                <option value="m">小 m</option>
                <option value="A">增 A</option>
                <option value="d">減 d</option>
              </select>
            </label>
            <label style="font-weight:700;font-size:0.86rem;">度數：
              <select id="int-size">
                <option value="2">2 度</option>
                <option value="3" selected>3 度</option>
                <option value="4">4 度</option>
                <option value="5">5 度</option>
                <option value="6">6 度</option>
                <option value="7">7 度</option>
                <option value="8">8 度</option>
                <option value="9">9 度 (複二度)</option>
                <option value="10">10 度 (複三度)</option>
              </select>
            </label>
            <button type="button" class="btn btn-sm btn-primary" id="int-play-harm">▶ 和聲音程</button>
            <button type="button" class="btn btn-sm" id="int-play-mel">▶ 旋律音程</button>
            <button type="button" class="btn btn-sm btn-amber" id="int-invert-btn">⇅ 八度轉位</button>
          </div>
          <div id="int-lab-readout" class="visual-pill"></div>
          <div id="int-lab-score"></div>
        </div>

        <!-- 經典歌曲記憶錨點 -->
        <div class="jam-pad-grid" id="song-anchors" style="grid-template-columns:repeat(auto-fit, minmax(125px, 1fr));">
          <button type="button" class="jam-pad" data-int="E4,F4" style="--pad-color:#f43f5e;min-block-size:62px;">
            <span>m2 小二度</span><span style="font-size:0.72rem;">🦈 大白鯊 Jaws</span>
          </button>
          <button type="button" class="jam-pad" data-int="C4,E4" style="--pad-color:#f59e0b;min-block-size:62px;">
            <span>M3 大三度</span><span style="font-size:0.72rem;">🎺 明亮號角</span>
          </button>
          <button type="button" class="jam-pad" data-int="G3,C4" style="--pad-color:#10b981;min-block-size:62px;">
            <span>P4 完全四度</span><span style="font-size:0.72rem;">💒 婚禮進行曲</span>
          </button>
          <button type="button" class="jam-pad" data-int="C4,G4" style="--pad-color:#3b82f6;min-block-size:62px;">
            <span>P5 完全五度</span><span style="font-size:0.72rem;">⚔️ 星際大戰</span>
          </button>
          <button type="button" class="jam-pad" data-int="C4,A4" style="--pad-color:#8b5cf6;min-block-size:62px;">
            <span>M6 大六度</span><span style="font-size:0.72rem;">⛵ My Bonnie</span>
          </button>
          <button type="button" class="jam-pad" data-int="C4,C5" style="--pad-color:#ec4899;min-block-size:62px;">
            <span>P8 完全八度</span><span style="font-size:0.72rem;">🌈 Over Rainbow</span>
          </button>
        </div>
      </section>

      <!-- 3. Focus on Skills 5 -->
      <section class="lesson-section" aria-labelledby="focus5-heading">
        <h2 id="focus5-heading">🏆 Focus on Skills 5：音程與轉位闖關檢定</h2>
        <div id="focus5-quiz"></div>
      </section>
    </main>
  </div>

  <footer id="site-footer"></footer>

  <script defer src="js/course-data.js"></script>
  <script defer src="js/audio-engine.js"></script>
  <script defer src="js/notation.js"></script>
  <script defer src="js/widgets.js"></script>
  <script defer src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Widgets.createLissajousInterval('#ch08-lissajous');

      const rootSel = document.getElementById('int-root');
      const qualSel = document.getElementById('int-qual');
      const sizeSel = document.getElementById('int-size');
      const readout = document.getElementById('int-lab-readout');
      let lowP = null, highP = null;

      function syncValidQuality() {
        const sz = Number(sizeSel.value);
        const simple = sz > 8 ? ((sz - 1) % 7) + 1 : sz;
        const isPerf = [1, 4, 5, 8].includes(simple);
        if (isPerf && (qualSel.value === 'M' || qualSel.value === 'm')) qualSel.value = 'P';
        else if (!isPerf && qualSel.value === 'P') qualSel.value = 'M';
      }

      function updateIntervalLab() {
        syncValidQuality();
        const rStr = rootSel.value;
        const q = qualSel.value;
        const sz = Number(sizeSel.value);
        lowP = CourseData.parsePitch(rStr);
        highP = CourseData.buildInterval(lowP, sz, q);
        const info = CourseData.calcInterval(lowP, highP);

        const invMap = { P: 'P', M: 'm', m: 'M', A: 'd', d: 'A' };
        const invText = sz <= 8 ? ` · 轉位 → <strong>${invMap[q]}${9 - sz}</strong>` : ` · 化簡單音程 → <strong>${q}${info.simpleSize}</strong>`;

        readout.innerHTML = `🎯 <strong>${lowP.label} + ${highP.label} ＝ ${info.code}</strong>（${info.semitones} 半音）${invText}`;

        MusicNotation.render('#int-lab-score', {
          clef: 'treble',
          playable: false,
          minWidth: 260,
          notes: [
            { notes: [lowP.ascii, highP.ascii], dur: 'h', label: `和聲 ${info.code}` },
            { bar: '|' },
            { pitch: lowP.ascii, dur: 'q', label: lowP.label },
            { pitch: highP.ascii, dur: 'q', label: highP.label }
          ]
        });
      }

      [rootSel, qualSel, sizeSel].forEach(el => el.addEventListener('change', updateIntervalLab));
      updateIntervalLab();

      document.getElementById('int-play-harm').addEventListener('click', () => AudioEngine.playChord([lowP, highP], 1.1));
      document.getElementById('int-play-mel').addEventListener('click', () => {
        AudioEngine.playSequence([{ pitch: lowP, beats: 0.6 }, { pitch: highP, beats: 0.9 }], 100);
      });
      document.getElementById('int-invert-btn').addEventListener('click', () => {
        const sz = Number(sizeSel.value);
        if (sz > 8) { sizeSel.value = String(((sz - 1) % 7) + 1); updateIntervalLab(); return; }
        const invMap = { P: 'P', M: 'm', m: 'M', A: 'd', d: 'A' };
        sizeSel.value = String(Math.max(2, 9 - sz));
        qualSel.value = invMap[qualSel.value] || 'P';
        updateIntervalLab();
        AudioEngine.playChord([lowP, highP], 0.95);
      });

      document.querySelectorAll('#song-anchors [data-int]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [p1, p2] = btn.dataset.int.split(',');
          AudioEngine.playSequence([{ pitch: p1, beats: 0.55 }, { pitch: p2, beats: 0.95 }], 104);
        });
      });

      Widgets.createQuiz('#focus5-quiz', 'quiz-focus5', 'ch08', [
        {
          prompt: '請問「F4 到 B♮4」與轉位後的「B3 到 F4」分別是什麼音程？（皆相距 6 半音三全音）',
          options: ['完全四度 ／ 完全五度', '增四度 (A4) ／ 減五度 (d5)', '減四度 ／ 增五度', '大四度 ／ 小五度'],
          answer: 1,
          explanation: 'F-G-A-B 共 4 字母（比 F 大調 B♭ 大半音）＝ A4；轉位 9-4=5 且 A↔d ＝ d5！'
        },
        {
          prompt: '將「小六度 (m6)」做八度和聲轉位後會變成什麼音程？',
          options: ['小三度 (m3)', '大三度 (M3)', '增三度 (A3)', '完全四度 (P4)'],
          answer: 1,
          explanation: '9 - 6 = 3 度，小 (m) 轉位變大 (M) → 大三度 (M3)！'
        },
        {
          prompt: '複音程「大十度 (M10)」減去一個八度後，等同於哪一個單音程？',
          options: ['大二度 (M2)', '大三度 (M3)', '完全四度 (P4)', '大六度 (M6)'],
          answer: 1,
          explanation: '10 - 7 = 3，性質不變 → 複大三度 (M3)！'
        },
        {
          prompt: '【心算接龍】從 C4 出發 → 往上完全五度 → 再往下小三度，終點是哪一個音？',
          options: ['E4', 'E♭4', 'D4', 'F4'],
          answer: 0,
          explanation: 'C4 往上 P5 = G4；G4 往下 m3（3 半音、兩字母）= E4！'
        }
      ]);
    });
  </script>
</body>
</html>
