<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
    } catch {}
  </script>
  <title>第 11 章：五聲與藍調推弦即興台 ＋ 焦點技能 6 | 創意音樂基礎 11e</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="ch11">
  <header id="site-header"></header>

  <div class="app-shell">
    <aside id="course-sidebar" class="course-sidebar"></aside>

    <main class="lesson-main">
      <section class="chapter-hero">
        <span class="chapter-eyebrow">Chapter 11 + Focus on Skills 6</span>
        <h1 id="main-heading" tabindex="-1">第 11 章：五聲音階、日本櫻花音階與藍調即興台</h1>
        <p class="chapter-subtitle">
          按下伴奏鼓點，直接用手指在<strong>五聲／櫻花／藍調推弦打擊墊</strong>上即興獨奏——怎麼彈都不會錯音！
        </p>
        <div class="pill-row">
          <span class="visual-pill">☀️ 大調五聲：<strong>1–2–3–5–6</strong>（抽掉 4·7 半音）</span>
          <span class="visual-pill">🌸 日本櫻花五聲：<strong>1–2–♭3–5–♭6</strong>（含半音！）</span>
          <span class="visual-pill">🎷 六音藍調：<strong>1–♭3–4–♭5–5–♭7</strong>（三個藍調音）</span>
        </div>
      </section>

      <!-- 1. 即興觸控打擊墊 + 伴奏鼓組 -->
      <section class="lesson-section" aria-labelledby="ch11-jam">
        <h2 id="ch11-jam">🎛️ 1. 觸控即興獨奏台（含自動伴奏律動 ＆ 藍調推弦彎音！）</h2>
        <div class="widget-box">
          <div id="ch11-jampad"></div>
        </div>
      </section>

      <!-- 2. 多調性五聲與藍調音階鍵盤映射 + 名曲對照 -->
      <section class="lesson-section" aria-labelledby="ch11-lab">
        <h2 id="ch11-lab">🎹 2. 五種五聲／藍調音階全調性檢視器</h2>
        <div class="widget-box">
          <div class="widget-controls" style="margin-block-start:0;">
            <label style="font-weight:800;">主音：
              <select id="pb-root">
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="Eb">E♭</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="A">A</option>
                <option value="Bb">B♭</option>
              </select>
            </label>
            <label style="font-weight:800;">類型：
              <select id="pb-type">
                <option value="blues" selected>🎷 六音藍調 (1-♭3-4-♭5-5-♭7)</option>
                <option value="majorPentatonic">☀️ 大調五聲 I (1-2-3-5-6)</option>
                <option value="majorPentatonicAlt">🌤️ 大調五聲 II (1-2-4-5-6)</option>
                <option value="minorPentatonic">🌙 小調五聲無半音 (1-♭3-4-5-♭7)</option>
                <option value="japanesePentatonic">🌸 日本五聲含半音 (櫻花)</option>
              </select>
            </label>
            <button type="button" class="btn btn-sm btn-primary" id="pb-play-btn">▶ 播放音階</button>
          </div>
          <div id="pb-readout" class="visual-pill"></div>
          <div id="pb-score"></div>
          <div id="pb-piano"></div>
        </div>
        <div id="score-auld-sakura"></div>
      </section>

      <!-- 3. Focus on Skills 6 -->
      <section class="lesson-section" aria-labelledby="focus6-heading">
        <h2 id="focus6-heading">🏆 Focus on Skills 6：小調、五聲與藍調綜合檢定</h2>
        <div id="focus6-quiz"></div>
      </section>
    </main>
  </div>

  <footer id="site-footer"></footer>

  <script defer src="js/course-data.js"></script>
  <script defer src="js/audio-engine.js"></script>
  <script defer src="js/notation.js"></script>
  <script defer src="js/widgets.js"></script>
  <script defer src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Widgets.createJamPad('#ch11-jampad', { defaultMode: 'blues' });

      MusicNotation.render('#score-auld-sakura', {
        title: '大調五聲《Auld Lang Syne》 vs 日本含半音五聲《Sakura》',
        clef: 'treble',
        bpm: 96,
        spacing: 38,
        notes: [
          { pitch: 'G3', dur: 'q', lyric: 'Should' },
          { pitch: 'C4', dur: 'q', dotted: true, lyric: 'auld' },
          { pitch: 'C4', dur: '8', lyric: 'ac-' },
          { pitch: 'E4', dur: 'q', lyric: 'quain-' },
          { pitch: 'D4', dur: 'h', lyric: 'tance' },
          { bar: '||' },
          { pitch: 'A4', dur: 'q', lyric: 'Sa-' },
          { pitch: 'A4', dur: 'q', lyric: 'ku-' },
          { pitch: 'B4', dur: 'h', lyric: 'ra' },
          { pitch: 'C5', dur: 'q', lyric: 'B-C!' },
          { pitch: 'B4', dur: 'q' },
          { pitch: 'A4', dur: 'q' },
          { pitch: 'F4', dur: 'q', lyric: 'F-E!' },
          { pitch: 'E4', dur: 'h' }
        ]
      });

      const piano = Widgets.createPiano('#pb-piano', { startMidi: 57, endMidi: 84 });
      const rootSel = document.getElementById('pb-root');
      const typeSel = document.getElementById('pb-type');
      const readout = document.getElementById('pb-readout');
      let curScale = null;

      function updatePB() {
        curScale = CourseData.buildScale(rootSel.value + '4', typeSel.value);
        readout.innerHTML = `🎵 <strong>${curScale.notes.map(n => n.name).join(' – ')}</strong>`;
        MusicNotation.render('#pb-score', {
          clef: 'treble',
          playable: false,
          spacing: 46,
          notes: curScale.notes.map(n => ({ pitch: n.ascii, dur: 'q', label: n.name }))
        });
        piano.highlightMidi(curScale.notes.map(n => n.midi), curScale.notes[0].midi);
      }

      [rootSel, typeSel].forEach(el => el.addEventListener('change', updatePB));
      updatePB();

      document.getElementById('pb-play-btn').addEventListener('click', () => {
        AudioEngine.playSequence(curScale.notes.map(n => ({ pitch: n, beats: 0.45 })), 108, {
          onStep: (ev) => piano.flashKey(ev.pitch.midi, 220)
        });
      });

      Widgets.createQuiz('#focus6-quiz', 'quiz-focus6', 'ch11', [
        {
          prompt: '六音藍調音階（如 C – E♭ – F – G♭ – G – B♭ – C）中的三個「藍調音 (Blue Notes)」是哪三個音級？',
          options: ['2, 4, 6', '♭3, ♭5, ♭7', '♯4, ♯5, ♯7', '♭2, ♭3, ♭6'],
          answer: 1,
          explanation: '降三音 (♭3)、降五音 (♭5) 與降七音 (♭7) 即為藍調三大靈魂 Blue Notes！'
        },
        {
          prompt: '以 C 為起點的「大調五聲音階第一型 (1-2-3-5-6)」，抽掉了大調音階中的哪兩個音級以消除半音？',
          options: ['第 2 與第 5 級', '第 4 與第 7 級（F 與 B）', '第 3 與第 6 級', '第 1 與第 5 級'],
          answer: 1,
          explanation: '抽掉製造半音的第 4 級與第 7 級，留下 C–D–E–G–A！'
        },
        {
          prompt: '日本民謠《櫻花 Sakura》（A–B–C–E–F–A）屬於哪一種音階？',
          options: ['無半音大調五聲', '含兩個半音的小調五聲音階', '六音藍調音階', '全音音階'],
          answer: 1,
          explanation: 'A–B–C–E–F–A 包含 B–C 與 E–F 兩處半音，屬於含半音的小調五聲音階！'
        }
      ]);
    });
  </script>
</body>
</html>
